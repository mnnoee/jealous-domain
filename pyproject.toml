[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jealous-domain"
description = "Domain diagnostics: RDAP/whois, DNS records, TLS certificate"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "mnnoee", email = "me@mnnoee.ru" }]
keywords = ["domain", "dns", "whois", "rdap", "ssl", "tls", "certificate", "diagnostics"]
dynamic = ["version"]

dependencies = []

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Natural Language :: Russian",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/mnnoee/jealous-domain"
Source = "https://github.com/mnnoee/jealous-domain"
Issues = "https://github.com/mnnoee/jealous-domain/issues"
Changelog = "https://github.com/mnnoee/jealous-domain/blob/master/CHANGELOG.md"

[project.scripts]
jealous-domain = "domaincheck.cli:main"

# Версия берётся из domaincheck.constants.VERSION — единственный источник истины.
# constants.py читается статически (ast), поэтому версия не требует импорта пакета
# во время сборки. __init__.py реэкспортирует её как __version__ для пользователей API.
[tool.setuptools.dynamic]
version = { attr = "domaincheck.constants.VERSION" }

# Плоский layout (без src/): дашборд Jealous Moon запускает
# domain_checker.py напрямую из корня репозитория, поэтому пакет
# обязан лежать рядом с ним.
[tool.setuptools.packages.find]
include = ["domaincheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: тесты с реальными сетевыми запросами (нужна сеть и утилиты dig/whois/openssl)",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Проект написан по-русски, но идентификаторы и код — на английском.
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Тестовые фикстуры — это сырые тексты логов/ответов, верстка там произвольная.
# E402: тесты вставляют путь к пакету в sys.path перед импортами.
"tests/*" = ["E501", "E402"]